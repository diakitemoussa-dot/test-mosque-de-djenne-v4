<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b0f14" />
  <title>Mosquée de Djenné — Visite Immersive 360°</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>

  <header id="topbar">
    <div class="brand">
      <span class="brand-title">MOSQUÉE DE DJENNÉ</span>
      <span class="brand-sub" id="nodeLabel">Chapitre 1</span>
    </div>
    <button class="icon-btn" id="soundBtn" aria-label="Son" aria-pressed="true">
      <svg class="sound-on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="wave" d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <svg class="sound-off" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.81 3.69-1.46L12 21l-2.75-2.75c-.41.29-.87.46-1.38.46C7.01 17 5 14.68 5 12c0-1.25.2-2.45.56-3.54l1.74 1.74A9.035 9.035 0 003 12c0 4.97 4.02 9 9 9a9.002 9.002 0 001.92-.34L4.27 3z" fill="currentColor"/></svg>
    </button>
    <button class="icon-btn" id="recenterBtn" aria-label="Recentrer">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </header>

  <button id="playPauseBtn" class="play-pause-btn" aria-label="Lire/Pause" aria-pressed="false">
    <svg class="progress-bg" viewBox="0 0 100 6" width="100" height="6" style="position:absolute;bottom:0;left:0;pointer-events:none;">
      <rect class="progress-fill" x="0" y="0" width="0%" height="6" rx="3" fill="#ffd700" style="transform-origin:left;transform:scaleX(0);transition:transform 0.1s linear;filter:drop-shadow(0 0 4px #ffd700);"/>
    </svg>
    <div class="btn-sketch" style="position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;pointer-events:none;">
      <svg class="sketch-lines" viewBox="0 0 120 72" width="120" height="72" style="pointer-events:none;">
        <!-- Rough rectangle outline - multiple sketch strokes -->
        <rect x="3" y="3" width="114" height="66" rx="8" fill="none" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.4" style="filter:url(#sketchFilter);"/>
        <rect x="2" y="2" width="116" height="68" rx="8" fill="none" stroke="#ffd700" stroke-width="1" stroke-dasharray="12,6" opacity="0.3" style="filter:url(#sketchFilter);transform:rotate(-0.5deg);transform-origin:center;"/>
        <rect x="1" y="1" width="118" height="70" rx="8" fill="none" stroke="#ffd700" stroke-width="0.8" stroke-dasharray="6,8" opacity="0.2" style="filter:url(#sketchFilter);transform:rotate(0.3deg);transform-origin:center;"/>
        <!-- Inner accent lines -->
        <line x1="15" y1="15" x2="35" y2="15" stroke="#ffd700" stroke-width="1.2" opacity="0.5" style="filter:url(#sketchFilter);"/>
        <line x1="85" y1="15" x2="105" y2="15" stroke="#ffd700" stroke-width="1.2" opacity="0.5" style="filter:url(#sketchFilter);"/>
        <line x1="15" y1="57" x2="40" y2="57" stroke="#ffd700" stroke-width="1.2" opacity="0.5" style="filter:url(#sketchFilter);"/>
        <line x1="80" y1="57" x2="105" y2="57" stroke="#ffd700" stroke-width="1.2" opacity="0.5" style="filter:url(#sketchFilter);"/>
        <!-- Corner marks -->
        <polyline points="10,20 10,10 20,10" fill="none" stroke="#ffd700" stroke-width="1.5" opacity="0.6" style="filter:url(#sketchFilter);"/>
        <polyline points="110,20 110,10 100,10" fill="none" stroke="#ffd700" stroke-width="1.5" opacity="0.6" style="filter:url(#sketchFilter);"/>
        <polyline points="10,52 10,62 20,62" fill="none" stroke="#ffd700" stroke-width="1.5" opacity="0.6" style="filter:url(#sketchFilter);"/>
        <polyline points="110,52 110,62 100,62" fill="none" stroke="#ffd700" stroke-width="1.5" opacity="0.6" style="filter:url(#sketchFilter);"/>
        <filter id="sketchFilter">
          <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </svg>
      <div class="btn-content" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;pointer-events:none;">
        <svg class="play-icon" viewBox="0 0 24 24" width="28" height="28"><polygon points="5,3 19,12 5,21" fill="#ffd700" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.5));"/></svg>
        <svg class="pause-icon" viewBox="0 0 24 24" width="28" height="28"><rect x="6" y="4" width="4" height="16" fill="#ffd700"/><rect x="14" y="4" width="4" height="16" fill="#ffd700"/></svg>
        <div class="loading-spinner"></div>
      </div>
    </div>
    <span class="chapter-badge"></span>
  </button>

  <script type="module" src="js/main.js"></script>
</body>
</html>
