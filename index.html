<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b0f14" />
  <title>Mosquée de Djenné — Visite Immersive 360°</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>

  <header id="topbar">
    <div class="brand">
      <span class="brand-title">MOSQUÉE DE DJENNÉ</span>
      <span class="brand-sub" id="nodeLabel">Chapitre 1</span>
    </div>
    <button class="icon-btn" id="recenterBtn" aria-label="Recentrer">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </header>

  <button id="playPauseBtn" class="play-pause-btn" aria-label="Lire/Pause">
    <svg class="play-icon" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21" fill="currentColor"/></svg>
    <svg class="pause-icon" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/></svg>
  </button>

  <script type="module" src="js/main.js"></script>
</body>
</html>
