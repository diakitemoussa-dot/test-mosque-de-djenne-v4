<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b0f14" />
  <title>Mosquée de Djenné — Visite Immersive 360°</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="hotspotLayer"></div>
  <div id="navLayer"></div>

  <header id="topbar">
    <div class="brand">
      <span class="brand-title">MOSQUÉE DE DJENNÉ</span>
      <span class="brand-sub" id="nodeLabel">Chapitre 1</span>
    </div>
    <button class="icon-btn" id="recenterBtn" aria-label="Recentrer">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </header>

  <section id="hotspotPanel" class="panel" aria-hidden="true">
    <button class="close-x" id="panelClose" aria-label="Fermer">&times;</button>
    <img id="panelImage" alt="" />
    <div class="panel-body">
      <h2 id="panelTitle"></h2>
      <p id="panelText"></p>
    </div>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
